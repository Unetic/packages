name: Reusable Rust CI and release

on:
  workflow_call:
    inputs:
      component_name:
        description: GitHub/Cargo package name, e.g. unetic-core
        required: true
        type: string
      binary_name:
        description: Binary produced by Cargo
        required: true
        type: string
      release:
        description: Build and publish OpenWrt release binaries after CI
        required: false
        default: false
        type: boolean
      ref:
        description: Branch, SHA or tag to check out. Empty means current event ref.
        required: false
        default: ""
        type: string

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      needs_build: ${{ steps.release.outputs.needs_build }}
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      deployment_sha: ${{ steps.release.outputs.deployment_sha }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      component_toolchain: ${{ steps.release.outputs.component_toolchain }}
    steps:
      - name: Check out component source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Prepare CI/release state
        id: release
        env:
          COMPONENT: ${{ inputs.component_name }}
          RELEASE: ${{ inputs.release }}
          REQUESTED_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          component_toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          test -n "$component_toolchain"
          echo "component_toolchain=$component_toolchain" >> "$GITHUB_OUTPUT"

          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE" != true ]; then
            echo 'needs_build=true' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'tag=' >> "$GITHUB_OUTPUT"
            echo 'deployment_sha=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="$REQUESTED_REF"
          tag="${tag#refs/tags/}"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release ref must be a semantic tag vX.Y.Z, got: $tag" >&2
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "Release tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Resolve packages/main once, then read only the immutable target config via GitHub API.
          # No second repository checkout is needed in component jobs.
          deployment_sha=$(gh api repos/Unetic/packages/commits/main --jq '.sha')
          echo "deployment_sha=$deployment_sha" >> "$GITHUB_OUTPUT"
          targets_json="$RUNNER_TEMP/unetic-targets.json"
          gh api "repos/Unetic/packages/contents/config/targets.json?ref=$deployment_sha" \
            --jq '.content' | tr -d '\n' | base64 --decode > "$targets_json"
          jq -e '.schema == 2 and .openwrt == "25.12" and (.targets | length > 0)' "$targets_json" >/dev/null

          matrix=$(jq -c '{include: [
            .targets[] |
            {
              openwrt: "25.12.5",
              architecture: .architecture,
              target: .target,
              subtarget: .subtarget,
              sdk_file: .sdk_file,
              sdk_sha256: .sdk_sha256,
              rust_target: .rust_target,
              rust_toolchain: .rust_toolchain,
              rust_build_std: .rust_build_std,
              toolchain_prefix: .toolchain_prefix
            }
          ]}' "$targets_json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          needs_build=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            complete=true
            while IFS= read -r expected; do
              grep -Fxq "$expected" <<<"$assets" || complete=false
            done < <(
              jq -r --arg component "$COMPONENT" --arg version "$version" '
              .targets[] |
              "\($component)-\($version)-openwrt-25.12.5-\(.architecture)"
              ' "$targets_json"
              echo SHA256SUMS
            )
            if [ "$complete" = true ]; then
              needs_build=false
            fi
          fi
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"

  test:
    needs: preflight
    if: ${{ !inputs.release || needs.preflight.outputs.needs_build == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out component source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Set up repository-pinned Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ needs.preflight.outputs.component_toolchain }}
          cache: true
          cache-key: ci-${{ inputs.component_name }}
          rustflags: ""

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Test release build
        run: cargo build --locked --release --all-features

  build-release:
    needs: [preflight, test]
    if: ${{ inputs.release && needs.preflight.outputs.needs_build == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out component source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Download pinned OpenWrt SDK
        env:
          OPENWRT_VERSION: ${{ matrix.openwrt }}
          OPENWRT_TARGET: ${{ matrix.target }}
          OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
          SDK_FILE: ${{ matrix.sdk_file }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/openwrt-sdk"
          archive="$RUNNER_TEMP/$SDK_FILE"
          url="https://downloads.openwrt.org/releases/$OPENWRT_VERSION/targets/$OPENWRT_TARGET/$OPENWRT_SUBTARGET/$SDK_FILE"

          rm -rf "$destination"
          mkdir -p "$destination"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" "$url"
          echo "$SDK_SHA256  $archive" | sha256sum --check
          tar --zstd --extract --file "$archive" --directory "$destination" --strip-components=1
          test -x "$destination/staging_dir/host/bin/apk"

      - name: Set up component-pinned Rust cross toolchain and cache
        if: ${{ !matrix.rust_build_std }}
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ needs.preflight.outputs.component_toolchain }}
          target: ${{ matrix.rust_target }}
          cache: true
          cache-key: openwrt-${{ inputs.component_name }}-${{ matrix.openwrt }}-${{ matrix.architecture }}
          rustflags: ""

      - name: Set up nightly Rust with rust-src and cache
        if: ${{ matrix.rust_build_std }}
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: ${{ matrix.rust_toolchain }}
          components: rust-src
          cache: true
          cache-key: openwrt-${{ inputs.component_name }}-${{ matrix.openwrt }}-${{ matrix.architecture }}
          rustflags: ""

      - name: Cross-build release binary with the pinned OpenWrt linker
        env:
          BINARY_NAME: ${{ inputs.binary_name }}
          COMPONENT: ${{ inputs.component_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RUST_BUILD_STD: ${{ matrix.rust_build_std }}
          RUST_TARGET: ${{ matrix.rust_target }}
          RUST_TOOLCHAIN: ${{ matrix.rust_toolchain }}
          COMPONENT_TOOLCHAIN: ${{ needs.preflight.outputs.component_toolchain }}
          TOOLCHAIN_PREFIX: ${{ matrix.toolchain_prefix }}
          OPENWRT_VERSION: ${{ matrix.openwrt }}
          PACKAGE_ARCH: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          linker=$(find "$RUNNER_TEMP/openwrt-sdk/staging_dir" \
            \( -type f -o -type l \) -name "$TOOLCHAIN_PREFIX-gcc" -print -quit)
          if [ -z "$linker" ]; then
            echo "OpenWrt linker not found: $TOOLCHAIN_PREFIX-gcc" >&2
            exit 1
          fi

          cargo_linker="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          export "$cargo_linker=$linker"
          export RUSTFLAGS='-C target-feature=-crt-static'

          if [ "$RUST_BUILD_STD" = true ]; then
            cargo "+$RUST_TOOLCHAIN" build --locked --release --target "$RUST_TARGET" \
              -Z build-std=std,panic_abort
          else
            cargo "+$COMPONENT_TOOLCHAIN" build --locked --release --target "$RUST_TARGET"
          fi

          mkdir -p release-assets
          asset="$COMPONENT-$VERSION-openwrt-$OPENWRT_VERSION-$PACKAGE_ARCH"
          install -m 755 "target/$RUST_TARGET/release/$BINARY_NAME" "release-assets/$asset"
          file "release-assets/$asset"

      - name: Upload binary for release job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ inputs.component_name }}-${{ matrix.openwrt }}-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    needs: [preflight, test, build-release]
    if: ${{ inputs.release && needs.preflight.outputs.needs_build == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all release binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-${{ inputs.component_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum ${{ inputs.component_name }}-* > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi
