name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Validate deployment configuration
        run: scripts/validate-ci-layout.sh

      - name: Verify staging script is executable
        run: test -x scripts/stage-released-components.sh
