name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Validate deployment configuration
        run: scripts/validate-ci-layout.sh

      - name: Verify packaging scripts are executable
        run: test -x scripts/download-openwrt-sdk.sh -a -x scripts/build-apk.sh -a -x scripts/sign-repository.sh
