name: Release APK repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing packages tag, for a controlled retry
        required: true
        type: string

concurrency:
  group: packages-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      target_matrix: ${{ steps.prepare.outputs.target_matrix }}
    steps:
      - name: Check out packages
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag and component releases
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${REQUESTED_TAG#refs/tags/}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${tag#v}"

          for repository in unetic-core unetic-cli unetic-web; do
            gh release view "$tag" --repo "Unetic/$repository" >/dev/null
          done

          jq -e --argjson expected '2' '.schema == $expected and .openwrt == "25.12" and (.architectures | length == 2)' config/targets.json >/dev/null

          matrix=$(jq -c '{
            include: [
              .targets[] | {
                openwrt: "25.12.5",
                architecture: .architecture,
                target: .target,
                subtarget: .subtarget,
                sdk_file: .sdk_file,
                sdk_sha256: .sdk_sha256
              }
            ]
          }' config/targets.json)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target_matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.target_matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out packages
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Download pinned OpenWrt SDK
        run: |
          scripts/download-openwrt-sdk.sh \
            '${{ matrix.openwrt }}' \
            '${{ matrix.target }}' \
            '${{ matrix.subtarget }}' \
            '${{ matrix.sdk_file }}' \
            '${{ matrix.sdk_sha256 }}' \
            "$RUNNER_TEMP/openwrt-sdk"

      - name: Download and verify released component artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-payload" "$RUNNER_TEMP/cli-payload" "$RUNNER_TEMP/web-payload" "$RUNNER_TEMP/downloads"

          # Core binary
          gh release download "$TAG" --repo Unetic/unetic-core \
            --pattern "unetic-core-$VERSION-openwrt-25.12.5-$ARCHITECTURE" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/downloads/core"
          (cd "$RUNNER_TEMP/downloads/core" && sha256sum -c SHA256SUMS --ignore-missing)
          install -m 755 "$RUNNER_TEMP/downloads/core/unetic-core-$VERSION-openwrt-25.12.5-$ARCHITECTURE" "$RUNNER_TEMP/core-payload/openwrt-binary"

          # CLI binary
          gh release download "$TAG" --repo Unetic/unetic-cli \
            --pattern "unetic-cli-$VERSION-openwrt-25.12.5-$ARCHITECTURE" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/downloads/cli"
          (cd "$RUNNER_TEMP/downloads/cli" && sha256sum -c SHA256SUMS --ignore-missing)
          install -m 755 "$RUNNER_TEMP/downloads/cli/unetic-cli-$VERSION-openwrt-25.12.5-$ARCHITECTURE" "$RUNNER_TEMP/cli-payload/openwrt-binary"

          # Web assets
          gh release download "$TAG" --repo Unetic/unetic-web \
            --pattern "unetic-web-dist-$VERSION.tar.gz" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/downloads/web"
          (cd "$RUNNER_TEMP/downloads/web" && sha256sum -c SHA256SUMS --ignore-missing)
          tar -C "$RUNNER_TEMP/web-payload" -xzf "$RUNNER_TEMP/downloads/web/unetic-web-dist-$VERSION.tar.gz"

      - name: Build and sign APK packages
        env:
          UNETIC_APK_PRIVATE_KEY: ${{ secrets.UNETIC_APK_PRIVATE_KEY }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/repo"
          mkdir -p "$repo"

          scripts/build-apk.sh unetic-core "$VERSION" "$RUNNER_TEMP/openwrt-sdk" "$RUNNER_TEMP/core-payload" "$repo"
          scripts/build-apk.sh unetic-cli "$VERSION" "$RUNNER_TEMP/openwrt-sdk" "$RUNNER_TEMP/cli-payload" "$repo"
          scripts/build-apk.sh unetic-web "$VERSION" "$RUNNER_TEMP/openwrt-sdk" "$RUNNER_TEMP/web-payload" "$repo"

          private_key="$RUNNER_TEMP/unetic-apk-private.pem"
          printf '%s\n' "$UNETIC_APK_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"
          scripts/sign-repository.sh "$RUNNER_TEMP/openwrt-sdk" "$repo" "$private_key"

      - name: Upload architecture repository
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-${{ matrix.architecture }}
          path: ${{ runner.temp }}/repo/**
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out packages
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Download built repositories
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: repository-*
          path: site/25.12
          merge-multiple: false

      - name: Normalize repository layout
        run: |
          set -euo pipefail
          for directory in site/25.12/repository-*; do
            architecture=${directory#site/25.12/repository-}
            mkdir -p "site/25.12/$architecture"
            cp -a "$directory/." "site/25.12/$architecture/"
            rm -rf "$directory"
          done
          mkdir -p site/keys
          cp keys/unetic-apk-v1.pem site/keys/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Deploy APK repository
        id: pages
        uses: actions/deploy-pages@v5.0.0

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          tar -C site -czf "unetic-repository-${TAG#v}.tar.gz" 25.12 keys
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "unetic-repository-${TAG#v}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "unetic-repository-${TAG#v}.tar.gz" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
