name: Release APK repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing packages tag, for a controlled retry
        required: true
        type: string

concurrency:
  group: packages-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      architectures: ${{ steps.prepare.outputs.architectures }}
    steps:
      - name: Check out packages
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag and component releases
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${REQUESTED_TAG#refs/tags/}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${tag#v}"

          for repository in unetic-core unetic-cli unetic-web; do
            gh release view "$tag" --repo "Unetic/$repository" >/dev/null
          done

          jq -e --argjson expected '2' '.schema == $expected and .openwrt == "25.12" and (.architectures | length == 2)' config/targets.json >/dev/null

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "architectures=$(jq -c .architectures config/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.preflight.outputs.architectures) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out packages
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Stage released component artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: scripts/stage-released-components.sh "$GITHUB_WORKSPACE"

      - name: Prepare artifacts directory
        run: mkdir -p "${{ runner.temp }}/openwrt-artifacts"

      - name: Build and sign APK packages with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: ${{ matrix.architecture }}-25.12.5
          FEEDNAME: unetic
          FEED_DIR: ${{ github.workspace }}
          ARTIFACTS_DIR: ${{ runner.temp }}/openwrt-artifacts
          PACKAGES: unetic-core unetic-cli unetic-web
          NO_DEFAULT_FEEDS: "1"
          EXTRA_MAKE_FLAGS: "-j2 V=s"
          INDEX: "1"
          PRIVATE_KEY: ${{ secrets.UNETIC_APK_PRIVATE_KEY }}

      - name: Upload architecture repository
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-${{ matrix.architecture }}
          path: ${{ runner.temp }}/openwrt-artifacts/bin/packages/**
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out packages
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Download built repositories
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: repository-*
          path: site/25.12
          merge-multiple: false

      - name: Normalize repository layout
        run: |
          set -euo pipefail
          for directory in site/25.12/repository-*; do
            architecture=${directory#site/25.12/repository-}
            mkdir -p "site/25.12/$architecture"
            cp -a "$directory/." "site/25.12/$architecture/"
            rm -rf "$directory"
          done
          mkdir -p site/keys
          cp keys/unetic-apk-v1.pem site/keys/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Deploy APK repository
        id: pages
        uses: actions/deploy-pages@v5.0.0

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          tar -C site -czf "unetic-repository-${TAG#v}.tar.gz" 25.12 keys
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "unetic-repository-${TAG#v}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "unetic-repository-${TAG#v}.tar.gz" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
